  primary_list_source: >-
    https://nsearchives.nseindia.com/content/indices/ind_nifty50list.csv
    (retrieved 2026-09-29; 50 rows, 50 unique symbols)
  reconstruction_method: bracketing between official NSE Indices press releases
  bracketing_events:
    - date: "2025-03-28"
      event: "BPCL, BRITANNIA excluded; JIOFIN, ZOMATO included"
      source: "https://nsearchives.nseindia.com/web/sites/default/files/2025-02/ind_prs21022025.pdf"
    - date: "2025-09-30"
      event: "HEROMOTOCO, INDUSINDBK excluded; INDIGO, MAXHEALTH included"
      source: "https://www.niftyindices.com/Press_Release/ind_prs22082025.pdf"
    - date: "2025-10-14"
      event: "DUMMYTATAM (synthetic, zero price) added to Nifty 50 for the Tata Motors demerger; not a listed security and deliberately excluded from this list"
      source: "https://www.niftyindices.com/Press_Release/ind_prs07102025.pdf"
    - date: "2025-11-17"
      event: "TMCV excluded for failing the price band; no replacement, count returns to 50"
      source: "https://niftyindices.com/Press_Release/ind_prs13112025.pdf"
    - date: "2026-03-30"
      event: "Nifty 50 review with no changes; bounds the window end"
      source: "https://niftyindices.com/Press_Release/ind_prs23022026.pdf"
  known_limitation: >-
    No publicly archived point-in-time constituent file dated 2025-11-04 was
    found; the list is established by bracketing official press releases.
  synthetic_index_entities_excluded:
    - symbol: DUMMYTATAM
      reason: >-
        Index-only placeholder for the Tata Motors commercial-vehicle demerger,
        added 2025-10-14 at zero price. Never a tradable listed security and
        has no price history, so it cannot be a Yahoo Finance sheet.

