# Demo / smoke-test configuration.
# Uses a tiny synthetic dataset — no Kaggle download required.
# Verifies the full per-stock pipeline end-to-end in CI and on a laptop.
#
# Feature set matches the Phase-1 reconstruction (OHLCV + the technical
# indicators actually used by the paper), so a passing demo run exercises the
# same code paths as the real reproduction.

experiment:
  name: demo_smoke
  seed: 42
  output_dir: ${AGENTIC_OUTPUT_ROOT}/demo/demo_smoke

data:
  synthetic: true
  n_tickers: 3
  n_days: 600
  sequence_length: 30
  target_type: next_day_direction
  train_fraction: 0.7
  val_fraction: 0.15

features:
  use_ohlcv: true
  indicators:
    - log_return
    - realized_volatility_20
    - rsi_14
    - macd
    - macd_signal
    - macd_histogram
    - atr_14
  drop_na: true

models:
  attention_lstm:
    enabled: true
    hidden_size: 16
    num_layers: 1
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 32
    epochs: 3
    patience: 10
    beta1: 0.9
    beta2: 0.999
    gradient_clip_norm: 1.0

calibration:
  method: temperature
  fit_on: val

evaluation:
  ece_bins: 10
  p_at_k: 3

baselines:
  enabled: true
  lstm: true
  random_forest: true
  logistic_regression: true
  majority: true

ablations:
  enabled: true

explainability:
  method: gradient_shap
  fallback: integrated_gradients
  attention_evidence: true
  top_k_features: 5
  background_samples: 64

risk:
  enabled: true
  formulation: atr_confidence_multiplier

reporting:
  formats: [html, pdf]
  llm:
    enabled: false
    fallback: deterministic

orchestration:
  export_final_results: false
