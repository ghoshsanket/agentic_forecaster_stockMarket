# PERFORMANCE-RECOVERY config: LEGACY Yahoo Finance data, UNADJUSTED.
#
# ROLE: ORIGINAL-RECOLLECTION CANDIDATE, RECOVERED TRAINING BUDGET
#
# Why this file exists
#   The quick legacy configs cap training at `epochs: 3`, which is the
#   AUTHOR-CONFIRMED maximum in configs/paper.yaml for the reproduction, but it
#   is a TRAINING BUDGET, not a property of the publication. The paper
#   specifies early-stopping patience 10 and does NOT specify any epoch cap.
#   Capping recovery runs at 3 epochs can only under-train the model, so this
#   config removes the artificial cap:
#
#       max_epochs: 100
#       patience: 10
#       restore_best_checkpoint: true
#
#   `restore_best_checkpoint` makes the run keep the best-validation-epoch
#   weights rather than the last epoch, which is what makes a 100-epoch budget
#   safe.
#
# *** NOT RUN DURING DATA RECONSTRUCTION. ***
# No model has been trained on this data. Creating this file changes nothing
# until it is executed deliberately:
#
# DO NOT RUN THIS CONFIG DIRECTLY.
#
# `agentic-forecaster train-all` trains a single fold_0 split and does NOT
# execute the paper's two-fold evaluation. For the FINAL paper evaluation use
# `reproduce-paper`, which calls run_walk_forward() and retrains every ticker
# for BOTH folds:
#
#     fold_0: train 2016-2020, validation 2021, test 2022
#     fold_1: train 2016-2021, validation 2022, test 2023
#
#   uv run python -m agentic_forecaster reproduce-paper \
#       --config configs/reproduction_search/legacy_yfinance_perf_unadjusted.yaml \
#       --device auto \
#       --run-id <id>
#
# The 2022/2023 test years must stay unseen until one configuration is frozen
# on pre-2022 validation. See docs/PERFORMANCE_RECOVERY.md.
experiment:
  name: legacy_yfinance_perf_unadjusted_recollection_candidate
  seed: 42
  output_dir: ${AGENTIC_OUTPUT_ROOT}/reproduction_search/legacy_yfinance_perf_unadjusted

data:
  raw_root: ${AGENTIC_YFINANCE_LEGACY_ROOT}/unadjusted/csv
  processed_root: ${AGENTIC_YFINANCE_LEGACY_ROOT}/unadjusted/processed
  source: yfinance_legacy
  universe_id: USER_SUPPLIED_LEGACY_NIFTY50_UNIVERSE
  universe_config: configs/nifty50_legacy_user_supplied.yaml
  lineage_config: configs/legacy_security_lineage.yaml
  variant: unadjusted
  auto_adjust: false
  source_level: daily                          # inputs are already daily bars
  resample_to_daily: false                     # do not resample again
  tickers: configs/nifty50_legacy_user_supplied.yaml
  allow_empty_sheets: true                     # 9 securities are intentionally empty
  expected_available_tickers: 41               # of 50 requested
  sequence_length: 30
  target_type: next_day_direction
  scaler: standard
  scaler_fit_scope: train_only
  train_start: "2016-01-01"
  train_end: "2020-12-31"
  val_start: "2021-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "2022-12-31"

features:
  use_ohlcv: true
  indicators:
    - log_return
    - realized_volatility_20
    - rsi_14
    - macd
    - macd_signal
    - macd_histogram
    - atr_14
  drop_na: true

models:
  attention_lstm:
    enabled: true
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 100
    patience: 10
    restore_best_checkpoint: true
    gradient_clip_norm: 1.0
  lstm:
    enabled: true
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 100
    patience: 10
    restore_best_checkpoint: true
    gradient_clip_norm: 1.0
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 8
  logistic_regression:
    enabled: true
    C: 1.0
    max_iter: 1000
  majority:
    enabled: true

calibration:
  method: temperature
  fit_on: val

evaluation:
  walk_forward:
    enabled: true
    folds: paper_exact
  metrics:
    - accuracy
    - brier
    - ece
    - precision_at_3
    - f1
    - roc_auc
  ece_bins: 10
  p_at_k: 3

explainability:
  method: gradient_shap
  fallback: integrated_gradients
  attention_evidence: true
  top_k_features: 5
  background_samples: 64

risk:
  enabled: true
  formulation: atr_confidence_multiplier
  confidence_bands:
    HIGH:   {threshold: 0.80, lambda_sl: 0.8,  lambda_tp: 1.5}
    MEDIUM: {threshold: 0.60, lambda_sl: 1.0,  lambda_tp: 1.0}
    LOW:    {threshold: 0.0,  lambda_sl: 1.2,  lambda_tp: 0.8}

reporting:
  formats: [html, pdf]
  llm:
    enabled: false
    provider: openai
    model: gpt-4o-mini
    fallback: deterministic

orchestration:
  export_final_results: true
