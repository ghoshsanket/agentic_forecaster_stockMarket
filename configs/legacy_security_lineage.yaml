# CORPORATE-IDENTITY REGISTRY for the USER-SUPPLIED LEGACY NIFTY-50 universe.
#
# WHAT THIS FILE IS
#   One entry per user-supplied legacy label.  For each label it records the
#   historical legal entity, what happened to it, the Yahoo symbol that (if
#   any) legitimately carries its SAME-SECURITY price history, and the policy
#   the downloader must follow.
#
# THE CENTRAL RULE
#   A successor company is NOT automatically the same security.  These are two
#   different things:
#
#     (a) same legal security that changed its NAME or TICKER
#         -> the historical series is CONTINUOUS and may be used.
#     (b) a company that was MERGED INTO, ACQUIRED BY or DEMERGED FROM a
#         different legal person
#         -> the historical series ENDS.  The successor's prices are NOT
#            appended.  Not forward-filled.  Not stitched.
#
#   Evidence standard (descending preference): court-approved scheme > NSE/BSE
#   notice > SEBI filing > company annual report / investor-relations page >
#   RoC/MCA record.  Yahoo company metadata is SUPPLEMENTARY only and is never
#   the sole basis for accepting a mapping.
#
# EVENT TYPES (controlled vocabulary)
#   unchanged | same_security_rename | statutory_continuation | demerger
#   merger_into_other_company | acquired_and_merged | delisted | unresolved
#
# primary_download_policy values
#   download_primary       download this symbol into the canonical dataset
#   download_primary_flagged  same, but the series has a documented structural
#                             break (demerger/statutory) inside the window
#   do_not_download        no legitimate same-security Yahoo history exists;
#                          the sheet is left EMPTY.  The successor is recorded
#                          for a future optional experiment ONLY and is never
#                          placed in the canonical workbook.
#
# GENERATED-AGAINST: yfinance_symbol_probe (metadata/yahoo_symbol_probe.csv),
# 2026-09.  Every primary_yahoo_candidate below was confirmed to actually
# return NSE data; every do_not_download label was probed across NSE and BSE
# and returned nothing.

registry_id: LEGACY_SECURITY_LINEAGE
universe_id: USER_SUPPLIED_LEGACY_NIFTY50_UNIVERSE
primary_exchange: NSE
stitch_successors_into_canonical: false

