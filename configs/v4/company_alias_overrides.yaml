# V4 company alias overrides.
#
# WHY THIS FILE EXISTS
# --------------------
# `configs/v2/sector_map.yaml` supplies an official NSE CURRENT company name for
# 26 supervised tickers. That is evidence of issuer identity and of the current
# official name -- and it is explicitly NOT evidence that the name was valid
# during the 2013-2018 news window. A current name applied backwards would be a
# silent anachronism, so any company whose name changed inside or before the
# study period is declared here, with a dated alias.
#
# Evidence types permitted here:
#   OFFICIAL_NSE_CONSTITUENT_FILE  ind_nifty50list.csv (official constituent list)
#   OFFICIAL_NSE_FILING           an NSE filing / official NSE master record
#   OFFICIAL_COMPANY_FILING       a company filing
#   OFFICIAL_COMPANY_HISTORY      a company's own official name-change record
#
# `historical_validity_independently_fetched: false` means the boundary date comes
# from a documented official determination that this run did not itself re-fetch
# from a company filing. It is recorded honestly rather than dressed up as an
# independently retrieved document.
#
# Do not edit configs/v4/company_aliases.yaml by hand: it is generated from the
# lineage registry, this file and the official NSE sector map.

registry_id: V4_COMPANY_ALIAS_OVERRIDES
applies_to: results/v2/multi_horizon/supervised_universe_frozen.json

