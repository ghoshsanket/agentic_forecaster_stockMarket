# =============================================================================
# V3 SOURCE REGISTRY -- PRE-COVID EXOGENOUS MARKET INFORMATION
#
# MODEL V2/V3 ARE NOT THE ORIGINAL PAPER MODEL.
# Classification: NEW_EXPERIMENTAL_ARCHITECTURE.
#
# NOTHING HERE IS ASSUMED TO WORK.  Every symbol below is PROBED first by
# scripts/probe_v3_sources.py, and a symbol that fails is recorded in
# results/v3/pre_covid_exogenous/source_audit.json with its rejection reason.
# A rejected source is EXCLUDED, never imputed, proxied or silently replaced.
#
# THE PREDICTION TIMESTAMP
#   AFTER the NSE market close on day t (Asia/Kolkata, 15:30).  A foreign daily
#   close that happens hours later is NOT available at t, even though the provider
#   labels it with the same calendar date.
#
# AVAILABILITY CLASSES
#   INDIA_SAME_CLOSE           the official value is known at/by the NSE close on
#                               t, so the date-t value may be used for an
#                               after-close prediction made at t.
#   EXTERNAL_CONSERVATIVE_LAG1 default for everything non-Indian: the provider's
#                               same-calendar-date close is NEVER used; the most
#                               recent COMPLETE observation strictly before t is.
#   VERIFIED_BEFORE_NSE_CLOSE  a same-day foreign value, allowed ONLY with
#                               documented proof that its session closes before the
#                               NSE close.  Not granted to Nikkei / Hang Seng.
#
#   => In the first run EVERY non-Indian series uses conservative lag1, which
#      intentionally sacrifices same-day information for causal safety.
#
# NSE INDEX POLICY
#   Real index series are used (^NSEI, ^NSEBANK, ^INDIAVIX, sector indices).
#   The reconstructed equal-weight proxy computed from the 50 stocks is NOT used
#   and is NOT called an index.
#
# FII/DII FLOWS
#   Optional and NOT required.  yfinance exposes no reproducible daily FII/DII net
#   flow series with documented publication timing, so they are declared here with
#   enabled=false and are expected to be REJECTED by the probe with a reason.  The
#   programme does not depend on them.
#
# FIELDS (per source, all required)
#   source_id, description, provider, provider_symbol_or_identifier, asset_class,
#   market_timezone, expected_session, availability_policy, frequency,
#   requested_start, requested_end, first_actual_date, last_actual_date,
#   missing_fraction, source_url_or_provenance, raw_sha256, enabled,
#   exclusion_reason
#
# The probe fills first_actual_date / last_actual_date / missing_fraction /
# raw_sha256 / enabled, and adds accepted / exclusion_reason evidence.
# =============================================================================

registry_version: 1
final_allowed_date: "2019-12-31"
download_end_exclusive: "2020-01-01"

# NSE sector index -> external sector index symbol.
#
# These keys are the ACTUAL sector vocabulary of the V2 sector map
# (v2/metadata/sector_map.csv), not finer NSE industry names, so a mapping can
# only be made where it is genuine.  A symbol whose source was REJECTED by the probe
# maps to nothing: an unavailable index never becomes a mapped feature.
#
# Deliberately NOT mapped, and why:
#   FINANCIALS               -> NIFTY Bank is a BANK index, not the whole financial
#                               sector; forcing it would be a dubious mapping
#   INDUSTRIALS              -> the only candidate (NIFTY Auto) is unavailable
#   ENERGY_AND_MATERIALS     -> NIFTY Energy / NIFTY Metal are unavailable
#   CONSUMER                 -> NIFTY FMCG is unavailable
#   SERVICES_AND_CONSTRUCTION-> NIFTY Realty / PSU Bank are unavailable
#   UNKNOWN                  -> never mapped
#
# The mapping is recorded and audited even when a sector maps to nothing: a security
# without a verified sector index keeps its stock features and is NOT dropped.
sector_index_map:
  IT_AND_TELECOM: "^CNXIT"
  HEALTHCARE: "^CNXPHARMA"

