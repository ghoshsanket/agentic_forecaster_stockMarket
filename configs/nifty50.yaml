# NIFTY-50 constituent universe for the paper reconstruction.
#
# RECONSTRUCTION POLICY (see docs/IMPLEMENTATION_ASSUMPTIONS.md):
#   The publication uses "NIFTY-50".  NIFTY-50 membership is time-varying and
#   the publication does not state an as-of date.  We therefore fix a concrete
#   constituent list (below) and record any security that cannot be resolved
#   against the downloaded dataset as UNAVAILABLE rather than silently
#   substituting a different company.
#
#   `aliases` maps a requested symbol to a dataset symbol ONLY when the two
#   are genuine symbol-format spellings of the SAME security (e.g. the NSE
#   symbol "M&M" is carried as "MM" by the data vendor).
#
#   A symbol is never mapped to a different company.  TATAMOTORS, for example,
#   is NOT aliased to TATACOMM.

