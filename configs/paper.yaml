# Phase-1 paper reconstruction configuration.
# Explanation-First Agentic Forecaster for Stock Market
# DOI: 10.1109/IEMENTECH202669403.2026.11434302
#
# PAPER-DEFINED:
#   - 50 selected NIFTY-50 stocks
#   - daily OHLCV resampled from intraday
#   - 30-day lookback sequences
#   - next-day direction target
#   - one independent model per stock
#   - ATR-based risk (confidence-multiplier formulation)
#   - cross-sectional Precision@3
#
# RECONSTRUCTION-ASSUMED (not explicitly stated in paper):
#   - 2 LSTM layers, hidden 64, dropout 0.2
#   - Adam betas (0.9, 0.999)
#   - temperature calibration method
#   - gradient clipping

experiment:
  name: paper_reproduction
  seed: 42
  output_dir: ${AGENTIC_OUTPUT_ROOT}/reproduction/paper_reproduction

data:
  raw_root: ${AGENTIC_RAW_DATA_ROOT}
  processed_root: ${AGENTIC_PROCESSED_DATA_ROOT}
  dataset_slug: debashis74017/algo-trading-data-nifty-100-data-with-indicators
  tickers: configs/nifty50.yaml
  sequence_length: 30
  target_type: next_day_direction       # PAPER-DEFINED
  scaler: standard
  scaler_fit_scope: train_only          # PAPER-DEFINED: per-stock, per-fold
  # Default split = paper walk-forward FOLD 0 (overridden per fold by orchestration)
  train_start: "2016-01-01"
  train_end: "2020-12-31"
  val_start: "2021-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "2022-12-31"

features:
  use_ohlcv: true                       # PAPER-DEFINED: raw OHLCV enters the model
  indicators:                           # PAPER-DEFINED Phase-1 feature set
    - log_return
    - realized_volatility_20
    - rsi_14
    - macd
    - macd_signal
    - macd_histogram
    - atr_14
  drop_na: true

models:
  attention_lstm:
    enabled: true
    hidden_size: 64                      # RECONSTRUCTION-ASSUMED
    num_layers: 2                         # RECONSTRUCTION-ASSUMED
    dropout: 0.2                          # RECONSTRUCTION-ASSUMED
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    epochs: 3                             # PAPER-DEFINED: maximum 3 epochs
    patience: 10
    beta1: 0.9
    beta2: 0.999
    gradient_clip_norm: 1.0
  lstm:
    enabled: true
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    epochs: 3
    patience: 10
    beta1: 0.9
    beta2: 0.999
    gradient_clip_norm: 1.0
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 8
  logistic_regression:
    enabled: true
    C: 1.0
  majority:
    enabled: true

calibration:
  method: temperature                     # RECONSTRUCTION-ASSUMED method
  fit_on: val

evaluation:
  walk_forward:
    enabled: true
    folds: paper_exact                     # PAPER-DEFINED: fold 0 + fold 1
  metrics:
    - accuracy
    - brier
    - ece
    - precision_at_3
    - f1
    - roc_auc
  ece_bins: 10
  p_at_k: 3

explainability:
  method: gradient_shap                   # primary reconstructed method
  fallback: permutation                   # explicitly reported fallback
  attention_evidence: true
  top_k_features: 5

risk:
  enabled: true
  formulation: atr_confidence_multiplier  # PAPER-DEFINED
  confidence_bands:
    HIGH:   {threshold: 0.80, lambda_sl: 0.8,  lambda_tp: 1.5}
    MEDIUM: {threshold: 0.60, lambda_sl: 1.0,  lambda_tp: 1.0}
    LOW:    {threshold: 0.0,  lambda_sl: 1.2,  lambda_tp: 0.8}

reporting:
  formats: [html, pdf]
  llm:
    enabled: false
    provider: openai
    model: gpt-4o-mini
    fallback: deterministic

orchestration:
  export_final_results: true
