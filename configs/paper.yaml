# Phase-1 paper reconstruction configuration.
# Explanation-First Agentic Forecaster for Stock Market
# DOI: 10.1109/IEMENTECH202669403.2026.11434302
#
# Every value below is tagged with one of:
#
#   PAPER-DEFINED        explicitly present in the publication
#   AUTHOR-CONFIRMED     confirmed by the authors, not verbatim in the text
#   RECONSTRUCTION-ASSUMED  chosen by the reconstruction team where the paper
#                           is silent or ambiguous
#
# PAPER-DEFINED: 50 NIFTY-50 securities; daily bars; next-day direction target;
#                five-agent architecture; attention formulation; binary logit;
#                Adam lr = 1e-3, beta1 = 0.9, beta2 = 0.999; batch size = 64;
#                patience = 10; ATR risk equations and confidence multipliers;
#                the two published walk-forward folds; published metric set.
# AUTHOR-CONFIRMED: one independent model per stock; 30-day lookback window;
#                maximum 10 training epochs; Python 3.11; PyTorch; LLM
#                explanation usage.
# RECONSTRUCTION-ASSUMED: StandardScaler convention; exact Phase-1 feature
#                subset; two LSTM layers; hidden size 64; dropout 0.2; weight
#                decay; gradient clipping; temperature-scaling method; SHAP
#                GradientExplainer implementation; ECE bin count; symmetric
#                bearish ATR treatment; CalibrationFactor = directional
#                confidence.

experiment:
  name: paper_reproduction
  seed: 42
  output_dir: ${AGENTIC_OUTPUT_ROOT}/reproduction/paper_reproduction

data:
  raw_root: ${AGENTIC_RAW_DATA_ROOT}
  processed_root: ${AGENTIC_PROCESSED_DATA_ROOT}
  dataset_slug: debashis74017/algo-trading-data-nifty-100-data-with-indicators
  tickers: configs/nifty50.yaml
  sequence_length: 30                        # AUTHOR-CONFIRMED
  target_type: next_day_direction            # PAPER-DEFINED
  scaler: standard                           # RECONSTRUCTION-ASSUMED
  scaler_fit_scope: train_only               # RECONSTRUCTION-ASSUMED (per stock, per fold)
  # Default split = paper walk-forward FOLD 0 (PAPER-DEFINED);
  # overridden per fold by orchestration/walk_forward.py
  train_start: "2016-01-01"
  train_end: "2020-12-31"
  val_start: "2021-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "2022-12-31"

features:
  use_ohlcv: true                            # PAPER-DEFINED
  indicators:                                # RECONSTRUCTION-ASSUMED (exact subset)
    - log_return
    - realized_volatility_20
    - rsi_14
    - macd
    - macd_signal
    - macd_histogram
    - atr_14
  drop_na: true                              # RECONSTRUCTION-ASSUMED

models:
  attention_lstm:
    enabled: true
    hidden_size: 64                          # RECONSTRUCTION-ASSUMED
    num_layers: 2                            # RECONSTRUCTION-ASSUMED
    dropout: 0.2                             # RECONSTRUCTION-ASSUMED
    learning_rate: 0.001                     # PAPER-DEFINED
    beta1: 0.9                               # PAPER-DEFINED
    beta2: 0.999                             # PAPER-DEFINED
    weight_decay: 0.0001                     # RECONSTRUCTION-ASSUMED
    batch_size: 64                           # PAPER-DEFINED
    epochs: 10                               # AUTHOR-CONFIRMED
    patience: 10                             # PAPER-DEFINED
    gradient_clip_norm: 1.0                  # RECONSTRUCTION-ASSUMED
  lstm:
    enabled: true
    hidden_size: 64                          # RECONSTRUCTION-ASSUMED
    num_layers: 2                            # RECONSTRUCTION-ASSUMED
    dropout: 0.2                             # RECONSTRUCTION-ASSUMED
    learning_rate: 0.001                     # PAPER-DEFINED
    beta1: 0.9                               # PAPER-DEFINED
    beta2: 0.999                             # PAPER-DEFINED
    weight_decay: 0.0001                     # RECONSTRUCTION-ASSUMED
    batch_size: 64                           # PAPER-DEFINED
    epochs: 10                               # AUTHOR-CONFIRMED
    patience: 10                             # PAPER-DEFINED
    gradient_clip_norm: 1.0                  # RECONSTRUCTION-ASSUMED
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 8
  logistic_regression:
    enabled: true
    C: 1.0
    max_iter: 1000
  majority:
    enabled: true

calibration:
  method: temperature                        # RECONSTRUCTION-ASSUMED (method)
  fit_on: val
  # CalibrationFactor is reconstructed as the directional confidence.

evaluation:
  walk_forward:
    enabled: true
    folds: paper_exact                       # PAPER-DEFINED (the two folds)
  metrics:                                   # PAPER-DEFINED
    - accuracy
    - brier
    - ece
    - precision_at_3
    - f1
    - roc_auc
  ece_bins: 10                              # RECONSTRUCTION-ASSUMED
  p_at_k: 3

explainability:
  method: gradient_shap                      # RECONSTRUCTION-ASSUMED
  fallback: integrated_gradients             # implemented fallback method
  attention_evidence: true                   # PAPER-DEFINED
  top_k_features: 5
  background_samples: 64

risk:
  enabled: true
  formulation: atr_confidence_multiplier    # PAPER-DEFINED
  confidence_bands:                          # PAPER-DEFINED multipliers
    HIGH:   {threshold: 0.80, lambda_sl: 0.8,  lambda_tp: 1.5}
    MEDIUM: {threshold: 0.60, lambda_sl: 1.0,  lambda_tp: 1.0}
    LOW:    {threshold: 0.0,  lambda_sl: 1.2,  lambda_tp: 0.8}

reporting:
  formats: [html, pdf]
  llm:
    enabled: false                           # AUTHOR-CONFIRMED (LLM explanations)
    provider: openai
    model: gpt-4o-mini
    fallback: deterministic

orchestration:
  export_final_results: true
