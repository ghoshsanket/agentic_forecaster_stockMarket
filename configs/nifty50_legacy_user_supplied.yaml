#
# PROVENANCE AND STATUS
# ---------------------
# universe_id: USER_SUPPLIED_LEGACY_NIFTY50_UNIVERSE
#
# This is the historical constituent list recovered by the user as the set
# intended for the ORIGINAL project implementation.  It is AUTHORITATIVE for
# reproduction purposes and is preserved EXACTLY as supplied, including its
# original ordering and original label spellings.
#
# It is explicitly NOT the modern NIFTY-50 and must never be silently replaced
# by today's constituents.  configs/nifty50.yaml (the modern reconstructed
# universe) is a DIFFERENT universe and is left untouched.
#
# HISTORICAL-DATE ANOMALY (documented, deliberately NOT corrected)
# --------------------------------------------------------------
# The user recalls this list as the 2000-01-03 constituent snapshot, but it is
# not claimed to be that.  POND'S (India) Limited appears in the list, and
# POND'S India had already amalgamated into Hindustan Lever in 1998 -- i.e.
# BEFORE the recalled snapshot date.  Therefore the constituent-date
# attribution is historically uncertain.  The possibilities are:
#
#   (a) an older NIFTY-50 constituent set than 2000-01-03,
#   (b) a legacy source whose labels were never refreshed after 1998, or
#   (c) the exact list used by the lost original implementation, even though
#       its own historical-date label was imperfect.
#
# The list is kept verbatim because it is the user's recovered EXPERIMENTAL
# universe.  POND'S is NOT deleted and is NOT silently rewritten to
# HINDUNILVR.  See docs/LEGACY_UNIVERSE_HISTORY.md.
#
# Labels are stored with their original human-readable spellings
# (e.g. "BRITISH OXYGEN (BOC)", "L&T", "POND'S").  Filesystem-safe names are
# derived in metadata/sheet_name_map.csv; the exact legacy_label is preserved
# in every metadata record.

