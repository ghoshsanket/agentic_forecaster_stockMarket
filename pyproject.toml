[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-forecaster"
version = "1.0.0"
description = "Explanation-First Agentic Forecaster for Stock Market — software reconstruction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanket" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "joblib>=1.3",
    # Required by the real DataAgent: processed daily bars are written as
    # <processed_root>/daily/<ticker>.parquet, so the Parquet engine is part of
    # a normal install, not an optional extra.
    "pyarrow>=14.0",
]

[project.optional-dependencies]
explain = ["shap>=0.43"]
llm = ["openai>=1.0"]
report = ["reportlab>=4.0"]
app = ["streamlit>=1.30"]
data = ["kaggle>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
    "shap>=0.43",
    "openai>=1.0",
    "reportlab>=4.0",
    "streamlit>=1.30",
    "kaggle>=1.6",
    "pytest>=8.0",
    "ruff>=0.4",
]

# uv dependency groups (used by `uv sync --all-extras`).
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
agentic-forecaster = "agentic_forecaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
    "real_data: needs the downloaded Kaggle dataset; opt in with AGENTIC_RUN_REAL_DATA_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Scripts carry a shebang and are not chmod +x; blind excepts are deliberate
# at orchestration boundaries where a failure must be recorded, not raised.
ignore = ["EXE001", "BLE001", "S112"]
